name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: proovra
      POSTGRES_PASSWORD: proovra_password
      POSTGRES_DB: proovra
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_password
      DATABASE_URL: postgresql://proovra:proovra_password@postgres:5432/proovra
      DIRECT_URL: postgresql://proovra:proovra_password@postgres:5432/proovra
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio_password
      S3_BUCKET: proovra-prod-assets
      S3_PUBLIC_BASE_URL: ""
      S3_ALLOW_INSECURE: "true"
      SIGNING_KEY_ID: proovra_ed25519
      SIGNING_KEY_VERSION: "1"
      SIGNING_PRIVATE_KEY_PATH: /run/signing/signer-private.pem
      SIGNING_PUBLIC_KEY_PATH: /run/signing/signer-public.pem
      CORS_ORIGINS: ""
      VERIFY_RATE_LIMIT_MAX: "60"
      VERIFY_RATE_LIMIT_WINDOW_SEC: "60"
      WORKER_BUILD_INFO: ci
      WORKER_PORT: "8090"
      # THE FULL STACK RUNS AS PRODUCTION, SO IT DEMANDS WHAT PRODUCTION
      # DEMANDS. Every one of these was missing, and each was fatal:
      #
      #   AUTH_JWT_SECRET               core-required; the API exited 1 at boot
      #   PDF_SIGNING_ENABLED           unset with no opt-out ack; same exit
      #   IDENTITY_SECURITY_HASH_SECRET boots fine, then EVERY authenticated
      #                                 request 401s on
      #                                 auth.revocation_check_failed
      #   PDF_SIGNING_P12_*             the report job fails five times on a
      #                                 missing .p12 and lands in the DLQ
      #
      # CI-only values. They are not secrets in any meaningful sense — this
      # stack lives for one job, holds nothing, and is thrown away — and they
      # are written here rather than in repository secrets precisely so a
      # reader can see that they are not real.
      AUTH_JWT_SECRET: ci_full_stack_jwt_secret_min_32_chars_2f9c1b
      IDENTITY_SECURITY_HASH_SECRET: ci_full_stack_identity_hash_secret_8d41ae
      PDF_SIGNING_ENABLED: "true"
      PDF_SIGNING_P12_PATH: /run/signing/pdf-signing.p12
      PDF_SIGNING_P12_PASSWORD: ci-only-ephemeral
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth-1: the runbook catalog's
          # freshness gate regenerates per-file last-changed dates from
          # `git log`, and a shallow clone reports every file as introduced
          # by the tip commit — so the gate failed on dates that were
          # correct in the repository and wrong only in the checkout.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install
        run: pnpm install

      # ---------------------------------------------------------------
      # PHASE 0 — Audit Engine integrity.
      #
      # Asks ONE question: is the measuring instrument sound? That the
      # analyzers run, that the generated artifacts on disk match what
      # the engine recomputes from this tree, that every conservation
      # identity holds, that no subject has two authorities, and that
      # the findings ledger is admissible to its own validator.
      #
      # It runs HERE — right after install, before lint, typecheck and
      # every product suite — because it is seconds long and because a
      # tree whose audit artifacts are stale should be reported as such
      # before twenty minutes of downstream work, not after.
      #
      # It is deliberately NOT `--closure-check`. That gate asks whether
      # the PRODUCT is finished, and it correctly exits non-zero while
      # FINAL-001 is open, so putting it in ordinary CI would make every
      # build red for a reason no PR can fix — which is how a red build
      # stops being read, taking this check down with it. Closure belongs
      # to release certification.
      #
      # No database, no Redis, no S3, no provider, no credential: it is
      # pure static analysis over the checked-out source, so it cannot
      # fail for an environmental reason and cannot leak anything.
      - name: Audit engine integrity
        run: pnpm audit:architecture --engine-check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck
        run: pnpm -r typecheck

      # ---------------------------------------------------------------
      # Phase 2.5E — Hard CI enforcement of migration safety.
      #
      # Three blocking checks, in order of severity:
      #
      #   1. BLOCKED-pattern scan. Any migration containing a pattern
      #      from the scanner's BLOCKED list (DROP DATABASE, DROP
      #      SCHEMA CASCADE, DROP ROLE) fails the build immediately.
      #      Exit code 9 is the signal.
      #
      #   2. The Phase 2.5C safety wrapper must still refuse a fake
      #      Neon URL with exit 3. This is the regression guard
      #      against a future PR weakening or removing the wrapper.
      #
      #   3. The Phase 2.5D in-process hook must still refuse a fake
      #      Neon URL with exit 8. Regression guard for the
      #      prisma.config.ts safety hook.
      #
      # Note: we intentionally do NOT fail the build on DESTRUCTIVE
      # patterns (exit 10) because the existing migration tree contains
      # legitimate historical DROP TABLE operations from early
      # development. A future phase can add per-PR diff scanning so
      # only NEW destructive content blocks; for now, the BLOCKED gate
      # is the hard line and DESTRUCTIVE is operator-visible via
      # `db:risk-scan` in the local workflow.
      # ---------------------------------------------------------------
      - name: Migration risk scan — BLOCKED patterns must not exist
        working-directory: services/api
        run: |
          set +e
          node scripts/migration-risk-scan.mjs > /tmp/risk-scan.txt 2>&1
          rc=$?
          set -e
          if [ "$rc" = "9" ]; then
            echo "FAIL — at least one migration contains a BLOCKED pattern."
            cat /tmp/risk-scan.txt
            exit 1
          fi
          echo "Risk scan exit code: $rc (0=SAFE, 10=DESTRUCTIVE-historical, 11=WARNING). No BLOCKED patterns."

      - name: Safety wrapper still refuses a fake Neon URL (Phase 2.5C regression guard)
        working-directory: services/api
        env:
          DATABASE_URL: "postgresql://x:y@ep-ci-sentinel.eu-central-1.aws.neon.tech:5432/sentinel"
        run: |
          set +e
          node scripts/safe-migrate.mjs deploy
          rc=$?
          set -e
          if [ "$rc" != "3" ]; then
            echo "FAIL — safe-migrate.mjs exited $rc on fake Neon URL; expected 3."
            exit 1
          fi
          echo "OK — wrapper refused with exit 3."

      - name: In-process hook still refuses a fake Neon URL (Phase 2.5D regression guard)
        working-directory: services/api
        env:
          DATABASE_URL: "postgresql://x:y@ep-ci-sentinel.eu-central-1.aws.neon.tech:5432/sentinel"
        run: |
          set +e
          pnpm exec prisma migrate status
          rc=$?
          set -e
          if [ "$rc" != "8" ]; then
            echo "FAIL — prisma.config.ts hook exited $rc on fake Neon URL; expected 8."
            exit 1
          fi
          echo "OK — in-process hook refused with exit 8."

      # ONE STEP PER PACKAGE, not a single `pnpm -r test`.
      #
      # The recursive form runs the same tests, but when it fails it says only
      # "Process completed with exit code 1". The step NAME is visible through
      # the jobs API; the log is not, without a token. So a single step made a
      # red build undiagnosable for anyone without log access, and that is not
      # a hypothetical inconvenience — it is exactly the position this branch
      # spent hours in, reproducing CI locally to guess which package was
      # failing.
      #
      # Split, the failing package is named by the step itself. Ordered cheapest
      # first so a broad failure surfaces in seconds rather than after the API's
      # twenty-three thousand cases.
      - name: Test — shared
        run: |
          set +e
          pnpm --filter @proovra/shared test 2>&1 | tee /tmp/test-out.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # Surface the outcome as ANNOTATIONS. Step logs require a token
            # to read; annotations do not, so a red build stays diagnosable
            # from the REST API alone.
            #
            # The SUMMARY lines are emitted unconditionally, not just the
            # failures, because the two most important cases look identical
            # otherwise: a real test failure, and vitest exiting non-zero
            # with every test passing (the birpc `onTaskUpdate` timeout this
            # repository has hit before). Without the counts, a run with no
            # FAIL lines says only 'exit code 1' and cannot be told apart
            # from a runner flake.
            grep -aE "^[[:space:]]*(FAIL|AssertionError|not ok|Test Files|Tests |Errors|Unhandled|✗)" /tmp/test-out.log \
              | tail -40 \
              | while IFS= read -r line; do echo "::error::@proovra/shared: $line"; done
          fi
          exit $rc

      - name: Test — ui
        run: |
          set +e
          pnpm --filter @proovra/ui test 2>&1 | tee /tmp/test-out.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # Surface the outcome as ANNOTATIONS. Step logs require a token
            # to read; annotations do not, so a red build stays diagnosable
            # from the REST API alone.
            #
            # The SUMMARY lines are emitted unconditionally, not just the
            # failures, because the two most important cases look identical
            # otherwise: a real test failure, and vitest exiting non-zero
            # with every test passing (the birpc `onTaskUpdate` timeout this
            # repository has hit before). Without the counts, a run with no
            # FAIL lines says only 'exit code 1' and cannot be told apart
            # from a runner flake.
            grep -aE "^[[:space:]]*(FAIL|AssertionError|not ok|Test Files|Tests |Errors|Unhandled|✗)" /tmp/test-out.log \
              | tail -40 \
              | while IFS= read -r line; do echo "::error::@proovra/ui: $line"; done
          fi
          exit $rc

      - name: Test — mobile
        run: |
          set +e
          pnpm --filter proovra-mobile test 2>&1 | tee /tmp/test-out.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # Surface the outcome as ANNOTATIONS. Step logs require a token
            # to read; annotations do not, so a red build stays diagnosable
            # from the REST API alone.
            #
            # The SUMMARY lines are emitted unconditionally, not just the
            # failures, because the two most important cases look identical
            # otherwise: a real test failure, and vitest exiting non-zero
            # with every test passing (the birpc `onTaskUpdate` timeout this
            # repository has hit before). Without the counts, a run with no
            # FAIL lines says only 'exit code 1' and cannot be told apart
            # from a runner flake.
            grep -aE "^[[:space:]]*(FAIL|AssertionError|not ok|Test Files|Tests |Errors|Unhandled|✗)" /tmp/test-out.log \
              | tail -40 \
              | while IFS= read -r line; do echo "::error::proovra-mobile: $line"; done
          fi
          exit $rc

      - name: Test — web
        run: |
          set +e
          pnpm --filter proovra-web test 2>&1 | tee /tmp/test-out.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # Surface the outcome as ANNOTATIONS. Step logs require a token
            # to read; annotations do not, so a red build stays diagnosable
            # from the REST API alone.
            #
            # The SUMMARY lines are emitted unconditionally, not just the
            # failures, because the two most important cases look identical
            # otherwise: a real test failure, and vitest exiting non-zero
            # with every test passing (the birpc `onTaskUpdate` timeout this
            # repository has hit before). Without the counts, a run with no
            # FAIL lines says only 'exit code 1' and cannot be told apart
            # from a runner flake.
            grep -aE "^[[:space:]]*(FAIL|AssertionError|not ok|Test Files|Tests |Errors|Unhandled|✗)" /tmp/test-out.log \
              | tail -40 \
              | while IFS= read -r line; do echo "::error::proovra-web: $line"; done
          fi
          exit $rc

      - name: Test — worker
        run: |
          set +e
          pnpm --filter proovra-worker test 2>&1 | tee /tmp/test-out.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            # Surface the outcome as ANNOTATIONS. Step logs require a token
            # to read; annotations do not, so a red build stays diagnosable
            # from the REST API alone.
            #
            # The SUMMARY lines are emitted unconditionally, not just the
            # failures, because the two most important cases look identical
            # otherwise: a real test failure, and vitest exiting non-zero
            # with every test passing (the birpc `onTaskUpdate` timeout this
            # repository has hit before). Without the counts, a run with no
            # FAIL lines says only 'exit code 1' and cannot be told apart
            # from a runner flake.
            grep -aE "^[[:space:]]*(FAIL|AssertionError|not ok|Test Files|Tests |Errors|Unhandled|✗)" /tmp/test-out.log \
              | tail -40 \
              | while IFS= read -r line; do echo "::error::proovra-worker: $line"; done
          fi
          exit $rc

      # The API step captures its WHOLE output and prints the tail UNFILTERED.
      #
      # An earlier form annotated only lines matching a pattern, and on the run
      # that mattered it matched NOTHING — not even vitest's own "Test
      # Files"/"Tests" summary. So the build said "exit code 1" and nothing
      # else, which is indistinguishable from a runner flake and is exactly the
      # state that must never be guessed at: an exit code with no output is not
      # evidence of a reporter problem, it is evidence of missing evidence.
      #
      # With the complete log in hand the actual cause was legible:
      #
      #   Test Files  724 passed (724)
      #        Tests  22999 passed | 1 skipped (23000)
      #       Errors  2 errors
      #   Error: [vitest-worker]: Timeout calling "onTaskUpdate"
      #
      # Every test passed. Two worker→main RPC calls went unanswered for the
      # sixty seconds birpc allows, and vitest counts an unhandled error as a
      # failed run. That sixty seconds is a hard-coded constant inside vitest,
      # reachable from no config option, so the only thing that can be changed
      # is how starved the main thread gets.
      #
      # Which is measurable rather than a guess: one test — the audit engine's
      # self-reference proof, which runs the whole engine twice through child
      # processes — occupies 245 of the run's 398 seconds and saturates every
      # core of a four-vCPU runner. Vitest's default worker count leaves the
      # main thread competing with three workers AND those children, and its
      # replies arrive late enough to trip the constant.
      #
      # So: fewer workers, and a reporter that does the least possible work per
      # update. Nothing is skipped, no assertion is relaxed, and the full 23,000
      # cases still run — the step just stops starving the thread that has to
      # acknowledge them.
      - name: Test — api
        run: |
          set +e
          start=$(date +%s)
          pnpm --filter proovra-api test -- --reporter=dot --maxWorkers=2 > /tmp/api-test.log 2>&1
          rc=$?
          set -e
          end=$(date +%s)
          echo "proovra-api tests exited $rc after $((end - start))s"

          # ---------------------------------------------------------------
          # The ONE excused non-zero exit, matched exactly.
          #
          # This suite has failed CI three consecutive runs with every test
          # PASSING: vitest's worker RPC ("onTaskUpdate") has a hardcoded
          # 60-second window, the run's collection phase saturates the main
          # process for far longer (measured: collect 347s of a 420s run),
          # the missed heartbeat surfaces as one "Unhandled Error", and
          # vitest exits 1 over a run whose summary reads
          # "756 passed / 23923 passed". The comment on the annotation
          # blocks below has DOCUMENTED this exact failure mode for months
          # while the gate went on failing green runs.
          #
          # So the gate now encodes what it already knew, narrowly: the
          # exit is excused ONLY when the summary proves zero failed files
          # and zero failed tests AND the only unhandled error present is
          # the known onTaskUpdate timeout. A single failing test, a
          # different unhandled error, a crash without a summary — anything
          # else — still fails exactly as before.
          # ---------------------------------------------------------------
          if [ "$rc" != "0" ]; then
            # The summary lines carry ANSI colour codes, so every pattern
            # anchors on words, never on adjacency, and every ambiguity
            # fails closed: "failed" anywhere on a summary-shaped line
            # disqualifies the excusal outright.
            files_clean=$(grep -acE "Test Files.*passed" /tmp/api-test.log || true)
            summary_failed=$(grep -aE "Test Files|Tests " /tmp/api-test.log | grep -ac "failed" || true)
            # Vitest states how many unhandled errors it caught; every one
            # of them must match the known signature, which appears exactly
            # once per error block.
            caught=$(grep -aoE "caught [0-9]+ unhandled" /tmp/api-test.log | grep -oE "[0-9]+" | head -1)
            caught=${caught:-0}
            known=$(grep -ac 'Timeout calling "onTaskUpdate"' /tmp/api-test.log || true)
            if [ "$files_clean" -ge 1 ] && [ "$summary_failed" = "0" ] \
               && [ "$caught" -ge 1 ] && [ "$known" -ge "$caught" ]; then
              echo "::warning::proovra-api: every test passed; exit $rc came from the known vitest onTaskUpdate RPC timeout ($caught unhandled error(s), all matching the known signature). Treated as pass; summary below."
              grep -aE "Test Files|Tests |Errors" /tmp/api-test.log | tail -4
              rc=0
            fi
          fi

          if [ "$rc" != "0" ]; then
            echo "=================== last 250 lines, unfiltered ==================="
            tail -n 250 /tmp/api-test.log
            echo "================================================================="
            echo "::error::proovra-api tests exited $rc after $((end - start))s — the complete log is the api-test-log artifact"
            tail -n 40 /tmp/api-test.log | while IFS= read -r line; do echo "::error::proovra-api: $line"; done
          fi
          exit $rc

      - name: Upload API test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-log
          path: /tmp/api-test.log
          if-no-files-found: ignore

      - name: Build Shared
        run: pnpm --filter @proovra/shared build

      - name: Build API
        run: pnpm --filter proovra-api build

      - name: Build Worker
        run: pnpm --filter proovra-worker build

      - name: Build Web
        run: pnpm --filter proovra-web build
      # THE STACK'S SIGNING MATERIAL, MINTED PER RUN.
      #
      # Point 8 stopped `services/api/Dockerfile` from copying
      # `services/api/keys`, because that shipped the repository's committed
      # dev fixture — a real Ed25519 private key, public in Git — inside the
      # production image. `assertNotCommittedFixture` then refuses that key by
      # public-key fingerprint even if it is mounted back in. So the image
      # ships no signer, on purpose, and this job supplies one that exists for
      # the length of one run and signs nothing anybody will ever verify.
      - name: Mint the full stack's ephemeral signing material
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/proovra-signing"
          mkdir -p "$dir"
          openssl genpkey -algorithm ed25519 -out "$dir/signer-private.pem"
          openssl pkey -in "$dir/signer-private.pem" -pubout -out "$dir/signer-public.pem"
          # The PDF artifact signer wants a PKCS#12. Self-signed and
          # two-day-lived: the report gate proves the signing PATH works, not
          # that a CI certificate is trustworthy.
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -subj "/CN=PROOVRA CI full-stack smoke" \
            -keyout "$dir/pdf-key.pem" -out "$dir/pdf-cert.pem"
          openssl pkcs12 -export -out "$dir/pdf-signing.p12" \
            -inkey "$dir/pdf-key.pem" -in "$dir/pdf-cert.pem" \
            -passout pass:ci-only-ephemeral
          echo "SIGNING_KEY_DIR=$dir" >> "$GITHUB_ENV"
          ls -l "$dir"


      # Build split from start, so a build failure is READABLE. `up -d`
      # swallows its build output: this step failed twice with nothing but
      # "exit code 1" while the actual error (a registry reset burst, then
      # whatever this run's cause is) sat in output nobody could see
      # without a token. The tail lands in annotations exactly the way the
      # test steps' failures do, and the disk readings bracket the build
      # because one runner building three monorepo images is the kind of
      # thing that dies of ENOSPC with a generic exit code.
      - name: Build full stack images
        run: |
          set +e
          df -h / | tail -1
          docker compose -f infra/docker/docker-compose.full.yml build 2>&1 | tee /tmp/compose-build.log
          rc=${PIPESTATUS[0]}
          set -e
          df -h / | tail -1
          if [ "$rc" != "0" ]; then
            echo "::error::full-stack image build exited $rc — tail follows"
            tail -n 40 /tmp/compose-build.log | while IFS= read -r line; do echo "::error::compose-build: $line"; done
          fi
          exit $rc

      # Captured, tailed and ANNOTATED, like every other step in this file.
      #
      # This step was `run: docker compose … up -d` and nothing else, so when it
      # failed the build said "Process completed with exit code 1" and no more.
      # `up -d` swallows what it was doing: it creates volumes and networks,
      # waits on four `depends_on` health conditions, and starts two built
      # images — and any one of those can be the cause. The "Logs on failure"
      # step below does dump `compose logs`, but a step LOG needs a token to
      # read, and annotations do not; that asymmetry is exactly why the test
      # steps above annotate their tails.
      #
      # It matters here more than anywhere else in the file. This is the last
      # step before the smoke test, it had not run to completion in over a
      # fortnight of red builds (every one of them failing earlier, at the audit
      # engine gate), and the first commit to reach it therefore hit a failure
      # nobody had ever seen output for. `docker compose ps` and `df -h` go in
      # too, because a stack that will not come up after three monorepo image
      # builds is as likely to be out of disk as misconfigured.
      # STARTED IN TWO HALVES, BECAUSE THE DATABASE HAS TO BE MIGRATED IN
      # BETWEEN.
      #
      # One `up -d` cannot work: the API validates its schema at boot and
      # refuses to start on a database nothing has migrated —
      #
      #   Critical schema drift detected at startup.
      #   CRITICAL schema drift (109 / 109 missing)
      #
      # — the worker's `depends_on: proovra-api: service_healthy` then cannot
      # be met, and compose fails the whole command. This step brings up only
      # what the migration needs.
      - name: Start full stack — infrastructure
        run: |
          set +e
          df -h / | tail -1
          docker compose -f infra/docker/docker-compose.full.yml \
            up -d postgres redis minio minio-init 2>&1 | tee /tmp/compose-infra.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            docker compose -f infra/docker/docker-compose.full.yml ps -a
            echo "::error::full-stack infrastructure start exited $rc — tail follows"
            tail -n 40 /tmp/compose-infra.log | while IFS= read -r line; do echo "::error::compose-infra: $line"; done
            df -h / | tail -1 | while IFS= read -r line; do echo "::error::disk: $line"; done
          fi
          exit $rc

      # Addressed at `localhost`, not at the compose hostname: this runs on the
      # RUNNER, and `postgres` resolves only inside the compose network. The
      # published port is the same database the containers reach by name.
      - name: Migrate and seed the full-stack database
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://proovra:proovra_password@localhost:5432/proovra
          DIRECT_URL: postgresql://proovra:proovra_password@localhost:5432/proovra
        run: |
          set -euo pipefail
          pnpm prisma migrate deploy
          pnpm prisma:seed

      - name: Start full stack — api and worker
        run: |
          set +e
          docker compose -f infra/docker/docker-compose.full.yml \
            up -d proovra-api proovra-worker 2>&1 | tee /tmp/compose-up.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "0" ]; then
            echo "=================== compose ps ==================="
            docker compose -f infra/docker/docker-compose.full.yml ps -a
            echo "=================== disk ========================="
            df -h /
            echo "::error::full-stack start exited $rc — tail follows"
            tail -n 40 /tmp/compose-up.log | while IFS= read -r line; do echo "::error::compose-up: $line"; done
            docker compose -f infra/docker/docker-compose.full.yml ps -a \
              | while IFS= read -r line; do echo "::error::compose-ps: $line"; done
            df -h / | tail -1 | while IFS= read -r line; do echo "::error::disk: $line"; done
          fi
          exit $rc

      - name: Wait for health
        run: |
          set -e
          api_id=$(docker compose -f infra/docker/docker-compose.full.yml ps -q proovra-api)
          worker_id=$(docker compose -f infra/docker/docker-compose.full.yml ps -q proovra-worker)
          for _ in {1..60}; do
            api_status=$(docker inspect -f '{{.State.Health.Status}}' "$api_id" 2>/dev/null || true)
            worker_status=$(docker inspect -f '{{.State.Health.Status}}' "$worker_id" 2>/dev/null || true)
            if [ "$api_status" = "healthy" ] && [ "$worker_status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker/docker-compose.full.yml ps
          exit 1

      # THE SMOKE, REWRITTEN ONTO THE PRODUCT THAT EXISTS.
      #
      # What was here posted `/v1/evidence` with no credentials and then polled
      # `report/latest` until a PDF appeared. Measured against this stack, that
      # sequence cannot pass and has not passed in 1,520 runs:
      #
      #   POST /v1/evidence                  401 UNAUTHORIZED
      #   POST /v1/auth/guest                404 — guest auth no longer exists
      #   report/latest                      404 — nothing enqueues a report on
      #                                      complete; regeneration is a route
      #   GenerateReportJob                  REPORT_NOT_INCLUDED_IN_PLAN on a
      #                                      new personal workspace, correctly
      #
      # So it now does what a person does: register, verify, sign in, accept
      # the current policies, capture a record, and read the report back.
      #
      # NO `jq`, AND EVERY FAILURE PRINTS ITS OWN BODY.
      #
      # The first version built its JSON with `jq -nc` and let `curl -f` fail.
      # It exited 22 — "HTTP page not retrieved" — one second in, on a 400 from
      # an EMPTY request body, and nothing in the log said which call or why.
      # `node` is guaranteed here (setup-node ran); `jq` is not this step's
      # business to depend on. So bodies are literal, responses are read with
      # `node -pe`, and `req` prints the status and the body whenever the
      # status is not the one expected.
      - name: E2E smoke — capture, sign, report, verify
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f infra/docker/docker-compose.full.yml"
          base="http://localhost:8080"
          email="ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          password="Ci-Smoke-Passw0rd-x9"
          token=""

          # req EXPECTED METHOD PATH [BODY] — leaves the body in /tmp/resp.json
          req() {
            local expected="$1" method="$2" path="$3" body="${4-}" status
            local args=(-sS -o /tmp/resp.json -w '%{http_code}' -X "$method" -H 'content-type: application/json')
            if [ -n "$token" ]; then args+=(-H "authorization: Bearer $token"); fi
            if [ -n "$body" ]; then args+=(--data-raw "$body"); fi
            status=$(curl "${args[@]}" "${base}${path}")
            if [ "$status" != "$expected" ]; then
              echo "::error::${method} ${path} returned ${status}, expected ${expected}"
              echo "--- response body ---"
              cat /tmp/resp.json || true
              echo
              return 1
            fi
          }

          # field a.b — read one value out of the last response
          field() {
            node -pe "JSON.parse(require('fs').readFileSync('/tmp/resp.json','utf8')).$1 ?? ''"
          }

          sql() { $COMPOSE exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "$1"; }

          echo "--- register"
          req 201 POST /v1/auth/email/register "{\"email\":\"${email}\",\"password\":\"${password}\",\"name\":\"CI Smoke\"}"

          # Verification email delivery is off in this stack (NOTIFICATIONS is
          # unconfigured, and `verificationSent: false` says so), and the token
          # is stored only as a hash, so it cannot be replayed. The runner owns
          # this disposable database, so the account is verified directly.
          sql "UPDATE users SET email_verified_at = now() WHERE email = '$email'"
          # Reports are a plan entitlement. A new personal workspace is FREE
          # and the worker refuses REPORT_NOT_INCLUDED_IN_PLAN, which is
          # correct product behaviour, so this throwaway account is put on PRO.
          sql "UPDATE entitlements SET plan = 'PRO' WHERE user_id = (SELECT id FROM users WHERE email = '$email')"

          echo "--- sign in"
          req 200 POST /v1/auth/email/login "{\"email\":\"${email}\",\"password\":\"${password}\"}"
          token=$(field token)
          test -n "$token"

          echo "--- accept the current policies"
          req 200 POST /v1/users/legal-acceptance '{"source":"ci-smoke","acceptances":[{"policyKey":"terms","policyVersion":"2026-04-06"},{"policyKey":"privacy","policyVersion":"2026-04-06"},{"policyKey":"cookies","policyVersion":"2026-04-06"}]}'

          echo "--- capture a record"
          req 201 POST /v1/evidence '{"type":"PHOTO","mimeType":"text/plain"}'
          id=$(field id)
          put=$(field 'upload.putUrl')
          test -n "$id"
          test -n "$put"

          # The presigned URL is signed FOR `minio:9000`, which is a name only
          # the compose network resolves, and the host is part of the SigV4
          # signature so it cannot be rewritten. The transfer therefore runs
          # where that name means something.
          echo "--- upload"
          $COMPOSE exec -T proovra-api sh -c "printf %s proovra-ci-smoke > /tmp/upload.txt && wget -qO- --method=PUT --body-file=/tmp/upload.txt --header='content-type: text/plain' '$put'"

          echo "--- finalize"
          req 200 POST "/v1/evidence/$id/complete" '{}'
          test "$(field status)" = "SIGNED"
          test -n "$(field signatureBase64)"
          test "$(field 'fingerprintHash.length')" = "64"

          echo "--- report"
          # 202, not 200: regeneration is ACCEPTED and handed to the worker,
          # and the message says so — "Poll /v1/evidence/:id/artifacts/status
          # for progress". Measured; the first version expected 200.
          req 202 POST "/v1/evidence/$id/reports/regenerate" '{}'
          url=""
          for _ in $(seq 1 45); do
            if req 200 GET "/v1/evidence/$id/report/latest" > /dev/null 2>&1; then
              url=$(field url)
              if [ -n "$url" ]; then break; fi
            fi
            sleep 2
          done
          if [ -z "$url" ]; then
            echo "::error::the report never appeared for evidence $id"
            $COMPOSE logs --no-color --tail=80 proovra-worker
            exit 1
          fi
          test "$(field version)" = "1"

          # Same reason as the upload: fetched from inside the network, and
          # asserted to be a PDF rather than merely a 200.
          echo "--- download the report"
          head=$($COMPOSE exec -T proovra-api sh -c "wget -qO /tmp/report.pdf '$url' && head -c 4 /tmp/report.pdf")
          test "$head" = "%PDF"

          echo "--- public verification"
          token=""
          req 200 GET "/public/verify/$id"
          test "$(field 'versioning.latestReportVersion')" = "1"
          echo "smoke OK — evidence $id signed, report v1 produced and verifiable"

      - name: Logs on failure
        if: failure()
        run: |
          set +e
          docker compose -f infra/docker/docker-compose.full.yml ps -a
          docker compose -f infra/docker/docker-compose.full.yml logs --no-color --tail=200 > /tmp/compose-logs.txt 2>&1
          cat /tmp/compose-logs.txt
          tail -n 60 /tmp/compose-logs.txt | while IFS= read -r line; do echo "::error::compose-logs: $line"; done
          exit 0
