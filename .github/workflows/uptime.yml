name: uptime

# OPS closure 2 (2026-11-21) — an uptime check that runs OUTSIDE the production
# host, so it still reports when the host, Docker, Caddy, the API process or the
# API's in-process outage watchdog are down (the watchdog cannot see its own
# death). What it probes and what it cannot see: docs/runbooks/disaster-recovery.md,
# "External uptime check".
#
# - Scheduled only (plus manual): never on push or pull_request, so it can never
#   be a required check and never runs in a PR's checks. A scheduled run is a
#   MONITOR run, not a push and not an application regression: its result says
#   what production and the monitor's own configuration looked like then.
# - Each run ends with exactly one outcome — `uptime-outcome: UP | DOWN |
#   CONFIG_MISSING | CONFIG_INVALID | NOTIFY_FAILED | SELFTEST` — in the log, in the job summary
#   (with every probe attempt: HTTP status, time, and for a non-200 attempt the
#   server / cf-mitigated / cf-ray headers and a sanitized body snippet) and as a
#   notice annotation the NEXT run reads back (checks: read) to decide DOWN /
#   RECOVERED. A configuration failure is never read as an outage, so adding the
#   secret does not post a false RECOVERED.
# - Its own concurrency group: it never cancels or queues behind ci, deploy or
#   any other workflow; a slow run is not overlapped by the next one.
# - Needs the repository secret OPS_ALERT_WEBHOOK_URL (the owner adds it; the same
#   Discord webhook the API uses is fine). Without it every run FAILS as
#   CONFIG_MISSING (annotation "OPS_ALERT_WEBHOOK_URL missing"); a failing probe
#   is still annotated "PROOVRA down" in that run.
# - workflow_dispatch with `selftest` adds a probe of a deliberately failing URL
#   (https://api.proovra.com/__uptime_selftest_404, a GET of a 404 path) and posts
#   "[TEST]"-labelled DOWN and RECOVERED messages to the configured webhook. A
#   self-test never feeds a later run's transition.
# - GitHub runs schedules on the default branch only and may delay them by
#   several minutes under load; cadence here is every 10 minutes.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      selftest:
        description: "Self-test: probe a deliberately failing URL and post [TEST] DOWN/RECOVERED messages to the configured webhook"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: uptime-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the probe script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ops/uptime-probe.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Probe api.proovra.com and www.proovra.com from outside the host
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          UPTIME_WORKFLOW_FILE: uptime.yml
          UPTIME_BRANCH: ${{ github.event.repository.default_branch }}
          UPTIME_SELFTEST: ${{ github.event_name == 'workflow_dispatch' && inputs.selftest && '1' || '0' }}
        run: node scripts/ops/uptime-probe.mjs
