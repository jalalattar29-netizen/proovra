name: native-build

# UC-LCH-003 — native capture code (Swift: ProovraScreenCaptureModule +
# the ProovraBroadcast Broadcast Upload Extension; Kotlin: MediaProjection
# services) was never COMPILED in CI: every workflow ran on ubuntu with
# node --test text checks. These jobs compile it.
#
#   * ios-simulator-build — `expo prebuild -p ios` + `xcodebuild` for the app
#     scheme on the iOS Simulator SDK, unsigned. The app embeds the
#     ProovraBroadcast extension, so the extension target compiles as a
#     dependency; the job then REFUSES a build whose products lack
#     ProovraBroadcast.appex (a silently dropped target is the defect class
#     the node-xcode double-embed fix closed).
#   * android-debug-build — `expo prebuild -p android` + `assembleDebug`.
#
# Neither job signs, uploads, or contacts EAS / App Store / Play. Device
# behaviour (MediaProjection consent, ReplayKit broadcast) still needs a
# physical device; this proves compilation and packaging only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared/src/**"
      - ".github/workflows/native-build.yml"
  # Every branch, like ci / playwright-e2e / schema-reproducibility: a branch that
  # changes native capture code proves it compiles before any PR or merge.
  push:
    paths:
      - "apps/mobile/**"
      - "packages/shared/src/**"
      - ".github/workflows/native-build.yml"

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-build:
    # PINNED, not macos-latest. macos-latest moved to macOS 26 (Xcode 26.x),
    # whose clang rejects React Native 0.76's bundled `fmt` pod ("call to
    # consteval function ... is not a constant expression" in
    # fmt/format-inl.h) — the first run of this job failed there, before any
    # project source compiled. Xcode 16.2 (the SDK-52 toolchain) is PROVEN to
    # compile it (RN 0.76.9 ships fmt 11.0.2 with no consteval fix, so 16.3+
    # fails the same way).
    #
    # macos-14, not macos-15: 16.2's storyboards (expo-dev-launcher) need the
    # iOS 18.2 platform, for a device build as much as for the simulator
    # ("iOS 18.2 Platform Not Installed" on macos-15 both ways), and
    # `xcodebuild -downloadPlatform iOS` exited 70 there. The macos-14 image
    # ships Xcode 16.2 WITH the iOS 18.2 simulator runtime installed.
    runs-on: macos-14
    timeout-minutes: 75
    steps:
      - name: Select Xcode 16.2 + its installed iOS 18.2 runtime (the SDK-52 toolchain)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version
          xcrun simctl list runtimes | grep -E "iOS 18\.2" || { echo "::error::iOS 18.2 simulator runtime missing on this image"; exit 1; }

      - uses: actions/checkout@v4

      # UC-IOS-012 — XCTest of ProovraDarwinNotify against the REAL Darwin
      # notify center on macOS. The package compiles the shipped file (copied
      # in here, never a second copy in git). Refuses fewer than 6 executed.
      - name: XCTest — ProovraDarwinNotify (UC-IOS-012)
        working-directory: apps/mobile/modules/proovra-screen-capture/ios-tests
        run: |
          set -o pipefail
          mkdir -p Sources/DarwinNotifyBridge
          cp ../ios/ProovraDarwinNotify.swift Sources/DarwinNotifyBridge/
          swift test 2>&1 | tee "$RUNNER_TEMP/xctest.log"
          line=$(grep -E "Executed [0-9]+ tests?, with [0-9]+ failures?" "$RUNNER_TEMP/xctest.log" | tail -1)
          echo "xctest: $line"
          executed=$(echo "$line" | sed -E 's/.*Executed ([0-9]+) tests?.*/\1/')
          failures=$(echo "$line" | sed -E 's/.*with ([0-9]+) failures?.*/\1/')
          skipped=$(grep -cE "Test Case .* skipped" "$RUNNER_TEMP/xctest.log" || true)
          if [ -z "$line" ] || [ "${executed:-0}" -lt 6 ]; then echo "::error::ProovraDarwinNotify XCTest executed ${executed:-0} tests (expected >= 6)"; exit 1; fi
          if [ "${failures:-1}" -ne 0 ]; then echo "::error::ProovraDarwinNotify XCTest failures: $failures"; exit 1; fi
          if [ "${skipped:-0}" -ne 0 ]; then echo "::error::ProovraDarwinNotify XCTest skipped $skipped"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        working-directory: apps/mobile
        run: pnpm run build:deps

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        env:
          EXPO_USE_WORKSPACE_ROOT: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: npx expo prebuild -p ios --no-install --clean

      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: xcodebuild — app + ProovraBroadcast (iphonesimulator, unsigned)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "workspace=$WS scheme=$SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log" | tail -200 || {
              rc=$?
              # Surface the compiler's own diagnostics as annotations: the raw
              # log is thousands of lines and the failing one is rarely in the
              # tail. Reporting only — the step still fails with xcodebuild's code.
              grep -E "(error|fatal error): " "$RUNNER_TEMP/xcodebuild.log" | sort -u | head -40 | while IFS= read -r line; do
                echo "::error::${line}"
              done
              exit "$rc"
            }

      - name: Refuse a build without the broadcast extension
        working-directory: apps/mobile/ios
        run: |
          APPEX=$(find build/Build/Products -name "ProovraBroadcast.appex" -type d | head -1)
          if [ -z "$APPEX" ]; then
            echo "::error::ProovraBroadcast.appex was not produced — the Broadcast Upload Extension did not compile/embed"
            exit 1
          fi
          echo "extension: $APPEX"
          ls -la "$APPEX"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log-${{ github.run_id }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        working-directory: apps/mobile
        run: pnpm run build:deps

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        env:
          EXPO_USE_WORKSPACE_ROOT: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: npx expo prebuild -p android --no-install --clean

      - name: Gradle assembleDebug (compiles the Kotlin capture services)
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # UC-AND-007 / UC-AND-013 — the capture services' failure decisions
      # (CaptureDecisions.kt: a throwing MediaRecorder.stop(), a null / refused
      # / throwing media projection) on the JVM. Refuses a run that executed
      # fewer than the 8 tests or skipped any.
      - name: JVM unit tests — capture decisions (UC-AND-007, UC-AND-013)
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          set -euo pipefail
          proj=$(./gradlew -q projects --no-daemon | grep -o "':[^']*screen-capture[^']*'" | head -1 | tr -d "'")
          if [ -z "$proj" ]; then
            echo "::error::the proovra-screen-capture Gradle project was not found"
            ./gradlew -q projects --no-daemon
            exit 1
          fi
          echo "module project: $proj"
          ./gradlew "${proj}:testDebugUnitTest" --no-daemon --stacktrace
          node -e '
            const fs = require("fs"), path = require("path");
            const root = path.resolve("../modules/proovra-screen-capture/android/build/test-results/testDebugUnitTest");
            const files = fs.existsSync(root) ? fs.readdirSync(root).filter((f) => /^TEST-.*\.xml$/.test(f)) : [];
            const t = { tests: 0, skipped: 0, failures: 0, errors: 0 };
            for (const f of files) {
              const head = fs.readFileSync(path.join(root, f), "utf8").match(/<testsuite[^>]*>/)?.[0] ?? "";
              for (const k of Object.keys(t)) t[k] += Number(head.match(new RegExp(` ${k}="(\\d+)"`))?.[1] ?? 0);
            }
            console.log("capture decisions JUnit:", JSON.stringify(t), files);
            if (t.tests < 8) { console.log(`::error::capture-decision unit tests executed ${t.tests} (expected >= 8)`); process.exit(1); }
            if (t.skipped > 0) { console.log(`::error::capture-decision unit tests SKIPPED ${t.skipped}`); process.exit(1); }
            if (t.failures + t.errors > 0) { console.log("::error::capture-decision unit tests failed"); process.exit(1); }
          '
