name: native-build

# UC-LCH-003 — native capture code (Swift: ProovraScreenCaptureModule +
# the ProovraBroadcast Broadcast Upload Extension; Kotlin: MediaProjection
# services) was never COMPILED in CI: every workflow ran on ubuntu with
# node --test text checks. These jobs compile it.
#
#   * ios-simulator-build — `expo prebuild -p ios` + `xcodebuild` for the app
#     scheme on the iOS Simulator SDK, unsigned. The app embeds the
#     ProovraBroadcast extension, so the extension target compiles as a
#     dependency; the job then REFUSES a build whose products lack
#     ProovraBroadcast.appex (a silently dropped target is the defect class
#     the node-xcode double-embed fix closed).
#   * android-debug-build — `expo prebuild -p android` + `assembleDebug`.
#
# Neither job signs, uploads, or contacts EAS / App Store / Play. Device
# behaviour (MediaProjection consent, ReplayKit broadcast) still needs a
# physical device; this proves compilation and packaging only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/shared/src/**"
      - ".github/workflows/native-build.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/shared/src/**"

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        working-directory: apps/mobile
        run: pnpm run build:deps

      - name: Expo prebuild (iOS)
        working-directory: apps/mobile
        env:
          EXPO_USE_WORKSPACE_ROOT: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: npx expo prebuild -p ios --no-install --clean

      - name: CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: xcodebuild — app + ProovraBroadcast (iphonesimulator, unsigned)
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "workspace=$WS scheme=$SCHEME"
          xcodebuild -workspace "$WS" -scheme "$SCHEME" \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log" | tail -200

      - name: Refuse a build without the broadcast extension
        working-directory: apps/mobile/ios
        run: |
          APPEX=$(find build/Build/Products -name "ProovraBroadcast.appex" -type d | head -1)
          if [ -z "$APPEX" ]; then
            echo "::error::ProovraBroadcast.appex was not produced — the Broadcast Upload Extension did not compile/embed"
            exit 1
          fi
          echo "extension: $APPEX"
          ls -la "$APPEX"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcodebuild-log-${{ github.run_id }}
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: warn
          retention-days: 14

  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        working-directory: apps/mobile
        run: pnpm run build:deps

      - name: Expo prebuild (Android)
        working-directory: apps/mobile
        env:
          EXPO_USE_WORKSPACE_ROOT: "1"
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: npx expo prebuild -p android --no-install --clean

      - name: Gradle assembleDebug (compiles the Kotlin capture services)
        working-directory: apps/mobile/android
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
