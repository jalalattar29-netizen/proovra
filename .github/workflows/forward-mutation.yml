name: forward-mutation

# AUD-33 (2026-10-20) — the INTEGRATION half of the forward mutation suite
# (scripts/mutation/forward-evidence-mutations.json). Every mutant whose killing
# test needs the real stack runs here: live PostgreSQL 16 (pgvector), Redis and
# a disposable MinIO, the same services the API integration suite uses in
# schema-reproducibility.yml. The unit half runs in ci.yml on every push.
#
# A mutant that SURVIVES, an anchor that no longer matches, or a red baseline
# fails the run. It runs on every push (so a branch proves its guards before a
# merge) and nightly (so drift in a dependency cannot quietly unpin a guard).

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

concurrency:
  group: forward-mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: proovra
          POSTGRES_PASSWORD: proovra_password
          POSTGRES_DB: proovra_mutation_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U proovra -d proovra_mutation_integration_test"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=3s
          --health-retries=20

    env:
      P7_TEST_REDIS_URL: redis://localhost:6379
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: "10.28.2"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the shared packages
        # Prisma's config requires a DATABASE_URL to generate the client; it
        # does not connect. The disposable database below is the one it names.
        env:
          DATABASE_URL: postgresql://proovra:proovra_password@localhost:5432/proovra_mutation_integration_test
        run: pnpm run build:shared

      - name: Migrate the disposable integration database
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://proovra:proovra_password@localhost:5432/proovra_mutation_integration_test
        run: pnpm prisma:migrate

      - name: Disposable object store
        run: |
          docker run -d --name mutation-minio --network host \
            -e MINIO_ROOT_USER=point7-local-minio \
            -e MINIO_ROOT_PASSWORD=point7-local-minio-secret \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data --address ':59000'
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:59000/minio/health/live >/dev/null 2>&1; then break; fi
            if [ "$i" = "60" ]; then echo "::error::disposable MinIO never became healthy"; exit 1; fi
            sleep 1
          done
          for bucket in point7-local-bucket; do
            docker run --rm --network host \
              -e MC_HOST_local=http://point7-local-minio:point7-local-minio-secret@127.0.0.1:59000 \
              pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd \
              mb --ignore-existing "local/${bucket}"
          done
          docker run --rm --network host \
            -e MC_HOST_local=http://point7-local-minio:point7-local-minio-secret@127.0.0.1:59000 \
            pgsty/mc:RELEASE.2026-09-16T00-00-00Z@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd \
            mb --with-lock --ignore-existing local/point7-lock-bucket

      - name: Forward mutation suite — integration mutants
        env:
          TEST_DATABASE_URL: postgresql://proovra:proovra_password@localhost:5432/proovra_mutation_integration_test
          RUN_LIVE_INTEGRATION_NO_TESTCONTAINERS: "1"
          AUTH_JWT_SECRET: ci-integration-only-secret-0123456789abcdef
        run: node scripts/mutation/run-mutations.mjs scripts/mutation/forward-evidence-mutations.json --integration-only
