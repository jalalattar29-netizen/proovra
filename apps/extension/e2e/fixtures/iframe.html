<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>PROOVRA E2E — Cross-origin iframe</title></head>
<body><h1>Cross-origin iframe host</h1>
<!-- Cross-origin WITHOUT leaving the machine: the fixture server answers on
     127.0.0.1, so localhost is a different origin served by the same process. -->
<iframe src="http://localhost:4599/static" width="600" height="300" title="cross-origin"></iframe>
<p id="marker">IFRAME-HOST-MARKER</p></body></html>
