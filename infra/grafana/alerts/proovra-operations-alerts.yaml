            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95, sum by (le) (rate(traces_spanmetrics_duration_milliseconds_bucket{span_name="proovra.openai.ai_request"}[15m]))) > 15000
        annotations:
          summary: OpenAI provider p95 latency above 15s for 15 minutes.
          runbook_url: docs/operations/observability-runbooks.md#openai-latency-elevated
