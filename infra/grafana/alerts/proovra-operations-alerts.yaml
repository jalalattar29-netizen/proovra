            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(reviewer_reconcile_failed_total[15m])) > 0.05
                  or sum(rate(traces_spanmetrics_calls_total{span_name="proovra.reviewer.reconcile",status_code="STATUS_CODE_ERROR"}[15m])) > 0.05
