# PROOVRA — Capture alert rules (UC-LCH-002)
#
# One failure-rate rule PER ACQUISITION MODE (packages/shared
# EVIDENCE_ACQUISITION_MODES) plus one rule per capture denial code that
# signals a client/server contract break. Every rule names a counter in the
# bounded registry (packages/shared-runtime/src/ops/metrics.service.ts
# COUNTER_NAMES) and links an anchor in docs/operations/capture-runbook.md.
# apps/web/__tests__/capture-alert-rules.test.ts is the lint that keeps this
# file, the mode list, the counter registry and the runbook in agreement.
#
# Thresholds are conservative starting points (failures per second over the
# window); tune before enabling on-call paging. Delivery depends on
# PROOVRA_ALERT_WEBHOOK_URL (provisioning/alerting/contact-points.yaml), which
# has no default by design — an unset webhook means these rules evaluate but
# notify nobody (see the runbook, "Alert delivery").

apiVersion: 1

groups:
  - orgId: 1
    name: proovra-capture
    folder: PROOVRA
    interval: 60s
    rules:
      - uid: proovra-capture-failed-proovra-web-upload
        # Counters have no series until first increment; "nothing failed yet"
        # arrives as NoData and must not page.
        noDataState: OK
        execErrState: Error
        title: Capture failures — PROOVRA_WEB_UPLOAD
        condition: capture_failed
        for: 10m
        data:
          - refId: capture_failed
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              refId: capture_failed
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
              expr: |
                sum(rate(capture_failed_proovra_web_upload_total[15m])) > bool 0.02
        annotations:
          summary: Sessions of the web upload (POST /v1/evidence → parts → complete) channel are failing to open or complete (acquisitionMode PROOVRA_WEB_UPLOAD).
          runbook_url: docs/operations/capture-runbook.md#capture-failed-proovra-web-upload
        labels:
          severity: critical
          area: capture

