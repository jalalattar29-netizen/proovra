              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              datasource:
                type: prometheus
                uid: prometheus
              expr: |
                sum(increase(capture_continuous_manifest_invalid_total[30m])) > bool 5
        annotations:
          summary: Continuous capture manifests refused (CONTINUOUS_MANIFEST_INVALID) above baseline in the last 30 minutes — likely a client/server contract regression.
          runbook_url: docs/operations/capture-runbook.md#continuous-manifest-invalid
        labels:
