        noDataState: OK
        execErrState: Error
        title: Continuous capture manifests refused (CONTINUOUS_MANIFEST_INVALID)
        condition: capture_denial
        for: 5m
        data:
          - refId: capture_denial
            relativeTimeRange:
              from: 1800
              to: 0
