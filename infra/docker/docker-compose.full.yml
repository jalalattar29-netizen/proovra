services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} && mc mb --ignore-existing local/proovra-prod-assets"
      ]

  proovra-api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      # Host network for the BUILD, matching deploy-images' buildx setup
      # ("Use the host network for BuildKit to reduce transient Docker
      # registry" errors). Without it, the in-build `pnpm install` dies on
      # registry ECONNRESETs behind BuildKit's default NAT — reproduced
      # twice locally, and the cause of CI's "Start full stack" failures
      # on the first runs ever to reach this step in days. deploy-images
      # builds the SAME Dockerfiles green with this exact mitigation.
      # Build-time only; the running container's network is unchanged.
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_ALLOW_INSECURE: ${S3_ALLOW_INSECURE}
      SIGNING_KEY_ID: ${SIGNING_KEY_ID}
      SIGNING_KEY_VERSION: ${SIGNING_KEY_VERSION}
      SIGNING_PRIVATE_KEY_PATH: ${SIGNING_PRIVATE_KEY_PATH}
      SIGNING_PUBLIC_KEY_PATH: ${SIGNING_PUBLIC_KEY_PATH}
      CORS_ORIGINS: ${CORS_ORIGINS}
      VERIFY_RATE_LIMIT_MAX: ${VERIFY_RATE_LIMIT_MAX}
      VERIFY_RATE_LIMIT_WINDOW_SEC: ${VERIFY_RATE_LIMIT_WINDOW_SEC}
      # Phase Y — Observability config (api side).
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  proovra-worker:
    build:
      context: ../..
      dockerfile: services/worker/Dockerfile
      # Same build-network mitigation as the api service above.
      network: host
      args:
        DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      # Startup race hotfix — wait for the api healthcheck to pass
      # before the worker enters the dependency. The in-process
      # readiness probe (api-readiness.ts) then verifies /readyz one
      # more time before any startup-triggered API call fires. Defense
      # in depth: docker gate + in-process gate.
      proovra-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_ALLOW_INSECURE: ${S3_ALLOW_INSECURE}
      WORKER_BUILD_INFO: ${WORKER_BUILD_INFO}
      WORKER_PORT: ${WORKER_PORT}
      # Phase Y — Observability config (worker side).
      SENTRY_DSN: ${SENTRY_DSN:-}
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-30000}
      WORKER_QUEUE_HEALTH_INTERVAL_MS: ${WORKER_QUEUE_HEALTH_INTERVAL_MS:-60000}
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
