version: "3.9"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  proovra-api:
    # PHASE 12 REMEDIATION — INFRA-001 (2026-08-06).
    #
    # The `:-latest` default is REMOVED. `${IMAGE_TAG:?...}` makes an unset or
    # empty IMAGE_TAG a HARD COMPOSE ERROR instead of silently resolving to
    # whatever the floating `:latest` tag happens to point at. The deployed
    # revision is now pinned by the invocation, so source-to-image
    # correspondence is determinable rather than assumed.
    #
    # IMAGE_TAG must be an IMMUTABLE release identity — a commit SHA or an
    # image digest. `scripts/verify-release-identity.mjs` refuses a mutable
    # tag and verifies the pulled images OCI `org.opencontainers.image.revision`
    # label matches the intended commit for BOTH services.
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/proovra-api:${IMAGE_TAG:?IMAGE_TAG must be an immutable release identity (commit SHA or digest); :latest is not permitted}
    env_file:
      - /opt/proovra/app/.env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      # NOTE: AUTH_JWT_SECRET is sourced from the env_file (and, in
      # production, may be backed by AWS Secrets Manager via P2.0).
      # We no longer pass it explicitly here so it does not appear in
      # `docker inspect` output.
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_ALLOW_INSECURE: ${S3_ALLOW_INSECURE}
      SIGNING_KEY_ID: ${SIGNING_KEY_ID}
      SIGNING_KEY_VERSION: ${SIGNING_KEY_VERSION}
      SIGNING_PRIVATE_KEY_PATH: ${SIGNING_PRIVATE_KEY_PATH}
      SIGNING_PUBLIC_KEY_PATH: ${SIGNING_PUBLIC_KEY_PATH}
      CORS_ORIGINS: ${CORS_ORIGINS}
      VERIFY_RATE_LIMIT_MAX: ${VERIFY_RATE_LIMIT_MAX}
      VERIFY_RATE_LIMIT_WINDOW_SEC: ${VERIFY_RATE_LIMIT_WINDOW_SEC}
      OTS_ENABLED: "true"
      OTS_BIN: ots
      OTS_CALENDAR_URL: https://a.pool.opentimestamps.org
      OTS_TIMEOUT_MS: "30000"
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      DEMO_REQUEST_AUTO_REPLY_ENABLED: ${DEMO_REQUEST_AUTO_REPLY_ENABLED}
      DEMO_REQUEST_NOTIFICATION_EMAIL: ${DEMO_REQUEST_NOTIFICATION_EMAIL}
      # Observability — Sentry + Grafana OTEL. All optional; safe
      # defaults apply when unset.
      METRICS_SCRAPE_TOKEN: ${METRICS_SCRAPE_TOKEN:-}
      # Sentry (errors + performance + profiling) — see
      # `services/api/src/observability/sentry.ts`. Sample rates are
      # capped per env so production never accidentally runs at 1.0.
      SENTRY_ENABLED: ${SENTRY_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # OTEL (Grafana Cloud OTLP gateway). Service-name is fixed to
      # `proovra-api` on this container so the api and worker report
      # as distinct services even with a shared `.env`.
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: proovra-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=proovra,deployment.environment=production}
      LOG_AGGREGATION_ENABLED: ${LOG_AGGREGATION_ENABLED:-true}
      # AWS Secrets Manager — Secrets Manager region is decoupled from
      # the app-wide AWS_REGION (which KMS uses on eu-north-1).
      AWS_SECRETS_ENABLED: ${AWS_SECRETS_ENABLED:-false}
      AWS_SECRET_NAME: ${AWS_SECRET_NAME:-proovra/prod/app-secrets}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-us-east-1}
      AWS_SECRETS_REFRESH_TTL_MS: ${AWS_SECRETS_REFRESH_TTL_MS:-3600000}
      AWS_REGION: ${AWS_REGION:-eu-north-1}

    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  proovra-worker:
    # INFRA-001 — same immutable identity, same variable. API and worker share
    # ONE IMAGE_TAG by construction, so they cannot skew relative to each
    # other; removing the default means they also cannot both float.
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER is required}/proovra-worker:${IMAGE_TAG:?IMAGE_TAG must be an immutable release identity (commit SHA or digest); :latest is not permitted}
    env_file:
      - /opt/proovra/app/.env
    depends_on:
      redis:
        condition: service_healthy
      # Startup race hotfix — wait for the api healthcheck to pass
      # before the worker container is started. The in-process
      # readiness probe (api-readiness.ts) then re-verifies /readyz
      # before any startup-triggered fetch. Defense in depth.
      proovra-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL}
      S3_ALLOW_INSECURE: ${S3_ALLOW_INSECURE}
      WORKER_BUILD_INFO: ${WORKER_BUILD_INFO}
      PDF_SIGNING_ENABLED: "true"
      PDF_SIGNING_P12_PATH: /app/services/worker/keys/proovra-signing.p12
      PACKAGE_SIGNING_PRIVATE_KEY_PATH: /app/services/worker/keys/signing-private.pem
      PACKAGE_SIGNING_PUBLIC_KEY_PATH: /app/services/worker/keys/signing-public.pem
      PACKAGE_SIGNING_KEY_ID: ${SIGNING_KEY_ID}
      PACKAGE_SIGNING_KEY_VERSION: ${SIGNING_KEY_VERSION}
      WORKER_PORT: ${WORKER_PORT}
      OTS_ENABLED: "true"
      OTS_BIN: ots
      OTS_CALENDAR_URL: https://a.pool.opentimestamps.org
      OTS_TIMEOUT_MS: "30000"
      ANCHOR_MODE: ${ANCHOR_MODE}
      ANCHOR_PROVIDER: ${ANCHOR_PROVIDER}
      ANCHOR_PUBLISH_URL: ${ANCHOR_PUBLISH_URL}
      ANCHOR_API_KEY: ${ANCHOR_API_KEY}
      ANCHOR_PUBLIC_BASE_URL: ${ANCHOR_PUBLIC_BASE_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
      DEMO_FOLLOW_UP_ENABLED: ${DEMO_FOLLOW_UP_ENABLED}
      DEMO_FOLLOW_UP_INTERVAL_MS: ${DEMO_FOLLOW_UP_INTERVAL_MS}
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      PUPPETEER_SKIP_DOWNLOAD: "true"
      # Observability — heartbeat / queue-health sampler defaults.
      WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-30000}
      WORKER_QUEUE_HEALTH_INTERVAL_MS: ${WORKER_QUEUE_HEALTH_INTERVAL_MS:-60000}
      # Sentry — same env knobs as api so a single .env covers both.
      # `serverName` is set in code to `proovra-worker` so the
      # Sentry UI separates worker errors from api errors.
      SENTRY_ENABLED: ${SENTRY_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.2}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.1}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      # OTEL — service-name pinned to `proovra-worker` so api and
      # worker telemetry are distinguishable even with a shared .env.
      OTEL_ENABLED: ${OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: proovra-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=proovra,deployment.environment=production}
      LOG_AGGREGATION_ENABLED: ${LOG_AGGREGATION_ENABLED:-true}
      # AWS Secrets Manager — same pattern as api. KMS still uses the
      # app-wide AWS_REGION (eu-north-1); Secrets Manager uses
      # AWS_SECRETS_REGION (us-east-1).
      AWS_SECRETS_ENABLED: ${AWS_SECRETS_ENABLED:-false}
      AWS_SECRET_NAME: ${AWS_SECRET_NAME:-proovra/prod/app-secrets}
      AWS_SECRETS_REGION: ${AWS_SECRETS_REGION:-us-east-1}
      AWS_SECRETS_REFRESH_TTL_MS: ${AWS_SECRETS_REFRESH_TTL_MS:-3600000}
      AWS_REGION: ${AWS_REGION:-eu-north-1}
    volumes:
      - /opt/proovra/app/services/worker/keys:/app/services/worker/keys:ro
      - /opt/proovra/app/services/worker/src/pdf/assets:/app/services/worker/src/pdf/assets:ro
      - /opt/proovra/app/services/worker/src/report-v2/assets:/app/services/worker/src/report-v2/assets:ro
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  caddy_data:
  caddy_config:
